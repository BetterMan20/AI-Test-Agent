# =============================================================
# 项目配置：A 项目（TopGame，包名 com.st.game.android）
# 仅描述「这个项目是什么、它有哪些能力/执行器、去哪里找它的数据」，
# 不写入任何具体测试数据或环境地址。
# =============================================================

name: a
display: "A项目 登录注册"
default_env: test

# 本项目提供的能力/执行器（对应 strategies）
capabilities:
  - key: api          # 抓包回放（API 业务）
    label: 抓包API回放
  - key: case         # 指定用例执行
    label: 指定用例执行

# 测试数据目录（相对项目根）
testdata_dir: testdata/a

# 项目适配器：Core 经 core.adapters.registry 动态加载
adapter:
  module: projects.a.adapters
  actions: [register_by_captcha, login_by_captcha, get_captcha, register_attack]

# 抓包库 / 素材源（whistle autosave 落盘目录，A 项目按 miregame 域名过滤）
assets:
  whistle_dir: "D:/higo-api"
  capture_keyword: "miregame"
  register_path: "/account/register_by_captcha"
  login_path: "/account/login_by_captcha"
  captcha_path: "/account/get_captcha"
