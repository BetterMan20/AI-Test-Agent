name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run secret scan
        run: python scripts/secret_scan.py
